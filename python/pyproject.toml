[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocean-in-motion-pipeline"
version = "0.1.0"
description = "Small, offline-first staging area for future marine geospatial processing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
temperature = ["numpy>=1.26", "netCDF4>=1.6", "shapely>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ocean_pipeline*"]

name: Refresh regional OBIS extracts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/refresh-species.yml
      - python/ocean_pipeline/sources.py
      - python/ocean_pipeline/publish_species.py
      - python/ocean_pipeline/publish_pilot.py
      - python/ocean_pipeline/curate.py
      - src/data/speciesMetadata.json

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch explicitly scoped occurrence datasets
        run: |
          PYTHONPATH=python python - <<'PY'
          from pathlib import Path
          from ocean_pipeline.sources import SourcePlan, stage_obis_occurrences
          from ocean_pipeline.publish_species import STUDIES
          from ocean_pipeline.publish_pilot import TAXON_ID, DATASET_ID, BOUNDS, START_DATE, END_DATE

          Path('output/obis').mkdir(parents=True, exist_ok=True)
          for slug, study in STUDIES.items():
            extract, manifest_path = Path(f'output/obis/{slug}.jsonl'), Path(f'output/obis/{slug}.manifest.json')
            plan=SourcePlan(str(study['taxon']),tuple(study['bounds']),study['start'],study['end'],10000,dataset_id=study['dataset'])
            manifest=stage_obis_occurrences(plan,extract,manifest_path)
            if not manifest['counts']['written'] or manifest['truncated_by_cap']:
              raise SystemExit(f'{slug}: incomplete extract')
            print(slug,manifest['counts']['written'],'staged',flush=True)
          slug = 'loggerhead-west-med-2013-2017'
          manifest = stage_obis_occurrences(
            SourcePlan(TAXON_ID,tuple(BOUNDS),START_DATE,END_DATE,10000,dataset_id=DATASET_ID),
            Path(f'output/obis/{slug}.jsonl'),Path(f'output/obis/{slug}.manifest.json'))
          if not manifest['counts']['written'] or manifest['truncated_by_cap']:
            raise SystemExit(f'{slug}: incomplete extract')
          print(slug,manifest['counts']['written'],'staged',flush=True)
          PY
      - name: Curate all seven species and audit rejected records
        run: PYTHONPATH=python python -m ocean_pipeline.curate --input-dir output/obis --output-root output
      - uses: actions/upload-artifact@v4
        with:
          name: scoped-obis-extracts
          path: output/
          retention-days: 7

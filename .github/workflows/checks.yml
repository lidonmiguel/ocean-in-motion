name: Checks
on:
  workflow_call:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './python[forecast,analysis]'
      # Discover every Python test once, including Caspian and geometry tests.
      - name: Run complete Python test suite
        run: python -m unittest discover -s python/tests -v
      - name: Verify forecast reproducibility
        run: python -m ocean_pipeline.forecast --check
      - name: Regenerate analysis figures
        run: python -m ocean_pipeline.forecast_analysis
      - name: Execute analysis notebook
        run: python -m ocean_pipeline.execute_notebook
      - name: Verify ocean route geometry
        run: python -m ocean_pipeline.temperature_routes --check

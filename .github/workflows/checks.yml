name: Checks
on:
  push:
  pull_request:
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s python/tests -v
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './python[forecast,analysis]'
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -p test_forecast.py -v
      - run: PYTHONPATH=python python -m ocean_pipeline.forecast --check
      - run: PYTHONPATH=python python -m ocean_pipeline.forecast_analysis
      - run: PYTHONPATH=python python -m ocean_pipeline.execute_notebook
      - run: PYTHONPATH=python python -m unittest discover -s python/tests -p test_temperature_routes.py -v
      - run: PYTHONPATH=python python -m ocean_pipeline.temperature_routes --check

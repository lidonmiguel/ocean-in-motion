name: Stage multi-species candidate extracts

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/species-geography-probe.yml]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage bounded direct-sighting candidates
        run: |
          PYTHONPATH=python python - <<'PY'
          from pathlib import Path
          from ocean_pipeline.sources import SourcePlan, stage_obis_occurrences

          inat='eaea291a-1e1d-4382-b86f-ac3cc15b8d5a'
          studies={
            'whale-shark-gulf-cal': (105847,inat,(-114,18,-99,31)),
            'whale-shark-philippines': (105847,inat,(114,0,131,22)),
            'whale-shark-ningaloo': (105847,inat,(111,-26,117,-17)),
            'whale-shark-mozambique': (105847,inat,(34,-28,45,-10)),
            'whale-shark-maldives': (105847,inat,(70,-2,76,9)),
            'swordfish-east-med': (127094,inat,(14,30,37,43)),
            'swordfish-us-east': (127094,inat,(-82,25,-66,44)),
            'swordfish-california': (127094,inat,(-126,28,-114,44)),
            'swordfish-iberian': (127094,inat,(-15,32,-6.1,46)),
            'humpback-hawaii': (137092,'9fc29d00-9998-4059-b0bd-f28cfa63a793',(-162,18,-153,24)),
            'humpback-alaska': (137092,'1dc828ac-d522-4ebf-97c3-e5a521b4509c',(-160,52,-130,64)),
            'humpback-australia': (137092,'3f424661-13b8-4008-8600-091bf43037ad',(145,-40,158,-12)),
            'humpback-south-africa': (137092,inat,(13,-38,39,-22)),
            'humpback-iceland': (137092,inat,(-28,62,-12,68)),
            'bottlenose-gulf-mexico': (137111,'717041c4-dd72-4457-8963-4e63e8e35710',(-98,18,-80,32)),
            'bottlenose-california': (137111,'86ffd903-47fc-435e-a42e-f3aec79c2d03',(-127,29,-115,44)),
            'bottlenose-australia': (137111,inat,(145,-40,158,-11)),
            'bottlenose-caribbean': (137111,inat,(-73,8,-59,24)),
            'bottlenose-south-africa': (137111,inat,(28,-36,47,-10)),
            'green-turtle-hawaii': (137206,'57fc04f0-c9f9-4d2f-9030-bf7281afda92',(-162,18,-153,24)),
            'green-turtle-australia': (137206,'0ae49e4e-ad4c-4b89-be2e-b6003c0038ec',(141,-30,155,-10)),
            'green-turtle-red-sea': (137206,inat,(32,12,44,30)),
            'green-turtle-seychelles': (137206,inat,(45,-12,61,0)),
            'green-turtle-galapagos': (137206,inat,(-92,-3,-89,2)),
            'loggerhead-florida': (137205,'eeb7f0c5-dfe8-4a07-b273-6dc4a634cc14',(-85,23,-74,35)),
            'loggerhead-east-med': (137205,'7225dc7b-dd9a-4bec-b689-f084a49d13eb',(14,30,37,43)),
            'loggerhead-japan': (137205,inat,(125,24,148,46)),
            'loggerhead-australia': (137205,inat,(145,-40,158,-14)),
            'loggerhead-south-africa': (137205,inat,(16,-38,37,-25)),
          }
          Path('output').mkdir(exist_ok=True)
          for slug,(taxon,dataset,bounds) in studies.items():
            manifest=stage_obis_occurrences(
              SourcePlan(str(taxon),bounds,'2014-01-01','2024-12-31',10000,dataset_id=dataset),
              Path(f'output/{slug}.jsonl'),Path(f'output/{slug}.manifest.json'))
            print(slug,manifest['counts']['written'],manifest['truncated_by_cap'],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: multi-species-candidate-extracts
          path: output/
          retention-days: 3

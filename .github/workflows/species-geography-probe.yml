name: Probe multi-species occurrence geography

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/species-geography-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect regional OBIS sources
        run: |
          python - <<'PY'
          import collections, json, time, urllib.parse, urllib.request
          from pathlib import Path

          studies = {
            'whale-shark': (105847, {
              'gulf-california': (-114,18,-99,31), 'galapagos': (-94,-5,-84,4),
              'red-sea': (32,12,44,30), 'mozambique': (34,-28,45,-10),
              'philippines': (114,0,131,22), 'ningaloo': (111,-26,117,-17),
              'maldives': (70,-2,76,9)}),
            'swordfish': (127094, {
              'iberian-atlantic': (-15,32,-4,46), 'eastern-med': (14,30,37,43),
              'us-east': (-82,25,-66,44), 'california': (-126,28,-114,44),
              'south-africa': (15,-38,38,-25), 'west-indian': (40,-30,70,5)}),
            'humpback': (137092, {
              'hawaii': (-162,18,-153,24), 'alaska': (-160,52,-130,64),
              'california': (-127,31,-116,48), 'east-australia': (145,-40,158,-12),
              'iceland': (-28,62,-12,68), 'south-africa': (13,-38,39,-22)}),
            'bottlenose': (137111, {
              'gulf-mexico': (-98,18,-80,32), 'europe-atlantic': (-13,35,2,53),
              'california': (-127,29,-115,44), 'east-australia': (145,-40,158,-11),
              'south-africa': (28,-36,47,-10), 'east-caribbean': (-73,8,-59,24)}),
            'green-turtle': (137206, {
              'hawaii': (-162,18,-153,24), 'east-australia': (141,-30,155,-10),
              'red-sea': (32,12,44,30), 'east-pacific': (-94,-5,-78,16),
              'seychelles': (45,-12,61,0), 'east-caribbean': (-73,8,-59,24)}),
            'loggerhead': (137205, {
              'florida': (-85,23,-74,35), 'eastern-med': (14,30,37,43),
              'northwest-atlantic': (-75,34,-60,50), 'japan': (125,24,148,46),
              'east-australia': (145,-40,158,-14), 'south-africa': (16,-38,37,-25)}),
          }
          inat='eaea291a-1e1d-4382-b86f-ac3cc15b8d5a'
          def get(url):
            for attempt in range(4):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'ocean-in-motion/0.1'}),timeout=45) as response:
                  return json.load(response)
              except Exception:
                if attempt == 3: raise
                time.sleep(2*(attempt+1))
          metadata={}
          def source(dataset):
            if dataset not in metadata:
              payload=get('https://api.obis.org/v3/dataset/'+dataset)
              m=payload['results'][0] if payload.get('results') else payload
              metadata[dataset]={key:m.get(key) for key in ('title','citation','intellectualrights','abstract')}
              metadata[dataset]['abstract']=(metadata[dataset]['abstract'] or '')[:900]
            return metadata[dataset]
          result={}
          for species,(taxon,regions) in studies.items():
            result[species]={}
            for slug,(w,s,e,n) in regions.items():
              geometry=f'POLYGON(({w} {s},{e} {s},{e} {n},{w} {n},{w} {s}))'
              params={'taxonid':taxon,'geometry':geometry,'startdate':'2014-01-01','enddate':'2024-12-31','size':120}
              payload=get('https://api.obis.org/v3/occurrence?'+urllib.parse.urlencode(params))
              rows=payload.get('results',[])
              summary=[]
              for dataset,count in collections.Counter(row.get('dataset_id') for row in rows).most_common(4):
                if not dataset: continue
                scoped=get('https://api.obis.org/v3/occurrence?'+urllib.parse.urlencode({**params,'datasetid':dataset,'size':1}))
                sample=next(row for row in rows if row.get('dataset_id')==dataset)
                summary.append({'dataset_id':dataset,'sample_count':count,'regional_total':scoped.get('total'),
                  **source(dataset),'example':{key:sample.get(key) for key in ('scientificName','eventDate','decimalLongitude','decimalLatitude','basisOfRecord','occurrenceStatus','coordinateUncertaintyInMeters','flags','marine','absence','dropped')}})
              if not any(item['dataset_id']==inat for item in summary):
                scoped=get('https://api.obis.org/v3/occurrence?'+urllib.parse.urlencode({**params,'datasetid':inat,'size':1}))
                if scoped.get('total'):
                  sample=scoped['results'][0]
                  summary.append({'dataset_id':inat,'sample_count':0,'regional_total':scoped.get('total'),
                    **source(inat),'example':{key:sample.get(key) for key in ('scientificName','eventDate','decimalLongitude','decimalLatitude','basisOfRecord','occurrenceStatus','coordinateUncertaintyInMeters','flags','marine','absence','dropped')}})
              result[species][slug]={'bounds':[w,s,e,n],'total':payload.get('total'),'datasets':summary}
              print(species,slug,payload.get('total'),[(d['regional_total'],d['title']) for d in summary],flush=True)
          Path('output').mkdir(exist_ok=True)
          Path('output/species-geography-probe.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: species-geography-probe
          path: output/species-geography-probe.json
          retention-days: 3

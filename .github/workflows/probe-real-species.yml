name: Probe scoped OBIS datasets

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/probe-real-species.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect candidate species and datasets
        run: |
          python - <<'PY'
          import collections, json, time, urllib.parse, urllib.request
          from pathlib import Path

          candidates = {
            'tuna': ('Thunnus thynnus', (-6, 35, 14, 44)),
            'whale-shark': ('Rhincodon typus', (-92, 17, -84, 26)),
            'swordfish': ('Xiphias gladius', (-6, 35, 14, 44)),
            'humpback-whale': ('Megaptera novaeangliae', (-72, 39, -59, 48)),
            'bottlenose-dolphin': ('Tursiops truncatus', (-2, 37, 12, 44)),
            'turtle': ('Chelonia mydas', (-86, 16, -74, 27)),
          }
          def get(url):
            for attempt in range(3):
              try:
                with urllib.request.urlopen(urllib.request.Request(url, headers={'User-Agent':'ocean-in-motion/0.1','Accept':'application/json'}), timeout=50) as response:
                  return json.load(response)
              except Exception:
                if attempt == 2: raise
                time.sleep(3 * (attempt + 1))
          results = {}
          for slug, (name, (w,s,e,n)) in candidates.items():
            try:
              records = get('https://www.marinespecies.org/rest/AphiaRecordsByName/' + urllib.parse.quote(name) + '?like=false&marine_only=true')
              match = next(record for record in records if record['scientificname'] == name)
              taxon = match['AphiaID']
              geometry = f'POLYGON(({w} {s},{e} {s},{e} {n},{w} {n},{w} {s}))'
              query = urllib.parse.urlencode({'taxonid':taxon,'geometry':geometry,'startdate':'2014-01-01','enddate':'2024-12-31','size':200,'offset':0})
              payload = get('https://api.obis.org/v3/occurrence?' + query)
              rows = payload['results']
              datasets = collections.Counter(row.get('dataset_id') for row in rows)
              summaries = []
              for dataset, count in datasets.most_common(12):
                sample = next(row for row in rows if row.get('dataset_id') == dataset)
                metadata = None
                if dataset:
                  try: metadata = get('https://api.obis.org/v3/dataset/' + dataset)
                  except Exception as error: metadata = {'error':str(error)}
                summaries.append({'dataset_id':dataset,'sample_count':count,'sample':{key:sample.get(key) for key in ('datasetName','scientificName','taxonID','decimalLongitude','decimalLatitude','eventDate','occurrenceStatus','coordinateUncertaintyInMeters','license','rightsHolder','bibliographicCitation','flags')},'metadata':metadata})
              results[slug] = {'name':name,'taxon_id':taxon,'worms_match':{'status':match.get('status'),'valid_AphiaID':match.get('valid_AphiaID')},'bounds':[w,s,e,n],'total':payload.get('total'),'sample_size':len(rows),'datasets':summaries}
            except Exception as error:
              results[slug] = {'name':name,'error':repr(error)}
          Path('output').mkdir(exist_ok=True)
          Path('output/probe.json').write_text(json.dumps(results, ensure_ascii=False, indent=2))
          print(json.dumps({slug:{'taxon_id':r.get('taxon_id'),'total':r.get('total'),'datasets':len(r.get('datasets',[])),'error':r.get('error')} for slug,r in results.items()}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: obis-dataset-probe
          path: output/probe.json
          retention-days: 3

name: Probe new OBIS species scopes

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/probe-new-species.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stage candidate regions for review
        run: |
          PYTHONPATH=python python - <<'PY'
          import json
          from pathlib import Path
          from ocean_pipeline.sources import SourcePlan, stage_obis_occurrences

          candidates = {
            'orca-pacific-nw': (137102, [-155, 45, -120, 65]),
            'orca-north-atlantic': (137102, [-30, 56, 25, 72]),
            'orca-new-zealand': (137102, [165, -49, 180, -30]),
            'orca-patagonia': (137102, [-78, -58, -52, -38]),
            'white-shark-california': (105838, [-130, 25, -114, 45]),
            'white-shark-south-africa': (105838, [15, -40, 37, -22]),
            'white-shark-east-australia': (105838, [145, -42, 160, -22]),
            'white-shark-west-australia': (105838, [110, -42, 130, -20]),
            'white-shark-us-atlantic': (105838, [-82, 30, -66, 47]),
            'leatherback-us-atlantic': (137209, [-82, 25, -60, 50]),
            'leatherback-caribbean': (137209, [-90, 5, -60, 24.9]),
            'leatherback-south-africa': (137209, [14, -40, 42, -19]),
            'leatherback-mediterranean': (137209, [-6, 30, 37, 46]),
            'leatherback-australia': (137209, [110, -43, 155, -10]),
          }
          root = Path('output/probe')
          root.mkdir(parents=True, exist_ok=True)
          summary = {}
          for slug, (taxon, bounds) in candidates.items():
            extract = root / f'{slug}.jsonl'
            manifest_path = root / f'{slug}.manifest.json'
            plan = SourcePlan(str(taxon), tuple(bounds), '2014-01-01', '2024-12-31', 10000,
                              dataset_id='eaea291a-1e1d-4382-b86f-ac3cc15b8d5a')
            try:
              manifest = stage_obis_occurrences(plan, extract, manifest_path)
              rows = [json.loads(line) for line in extract.read_text().splitlines()]
              summary[slug] = {
                'taxon': taxon, 'bounds': bounds, 'staged': len(rows),
                'api_total': manifest['counts']['api_total_reported'],
                'truncated': manifest['truncated_by_cap'],
                'aphiaIDs': sorted({str(row.get('aphiaID')) for row in rows}),
                'speciesIDs': sorted({str(row.get('speciesid')) for row in rows}),
                'flags': sorted({str(flag) for row in rows for flag in (row.get('flags') or [])}),
                'basisOfRecord': sorted({str(row.get('basisOfRecord')) for row in rows}),
                'strictCandidates': sum(row.get('aphiaID') == taxon and row.get('speciesid') == taxon
                    and row.get('marine') is True and row.get('absence') is False
                    and row.get('dropped') is False and 'ON_LAND' not in (row.get('flags') or [])
                    and (row.get('coordinateUncertaintyInMeters') is None
                         or row['coordinateUncertaintyInMeters'] <= 300000) for row in rows)
              }
            except Exception as error:
              summary[slug] = {'error': str(error)}
            print(slug, summary[slug], flush=True)
          (root / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: new-species-probe
          path: output/probe/
          retention-days: 7
